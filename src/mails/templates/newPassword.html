<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Criação de senha</title>
</head>
<body style="margin: 0; padding: 0; background-color: #a09a9c; font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
  <!-- Spacer row -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td height="50">&nbsp;</td>
    </tr>
  </table>
  
  <!-- Content table -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center">
        <!-- Container Table -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 20px;">
          <tr>
            <td align="center" style="padding: 40px 30px;">
              <!-- Content Table -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="text-align: left; padding-bottom: 20px;">
                    <h1 style="margin: 0; font-size: 24px; font-weight: bold; color: #333333;">Criação de senha</h1>
                  </td>
                </tr>
                <tr>
                  <td style="text-align: left; padding-bottom: 20px;">
                    <p style="margin: 0;">Olá {{ name }},</p>
                  </td>
                </tr>
                <tr>
                  <td style="text-align: left; padding-bottom: 20px;">
                    <p style="margin: 0;">Você foi cadastrado no dashboard ChatMix, acesse o link abaixo para definir uma nova senha.</p>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding: 20px 0;">
                    <table cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" bgcolor="#9B803E" style="border-radius: 4px;">
                          <a style="display: inline-block; padding: 10px 20px; color: #ffffff; font-weight: bold; text-decoration: none;" href="{{ domain }}">Definir senha</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
 
                <tr>
                  <td style="text-align: left;">
                    <p style="margin: 0;">Obrigado,<br>Equipe Chatmix</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
  
  <!-- Spacer row -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td height="50">&nbsp;</td>
    </tr>
  </table>
</body>
</html>
